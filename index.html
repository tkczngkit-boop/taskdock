const sortT = (a, b) => Number(a.sort) - Number(b.sort); // 分割線と手動の順番を崩さないよう、完了や重要では動かさない

function renderSomeday() {
  const tasks = somedayTasks().sort(sortT);
  const h = tasks.reduce((a, t) => a + Number(t.estimated_hours || 0), 0);
  const closed = !!S.collapsed.someday;
  return `<div class="card someday" id="someday">
    <div class="sd-h ${closed ? 'closed' : ''}" id="sd-h">${ICON.chev}<span class="pin">${ICON.pin}いつかやる</span><span class="n">${tasks.length} 件</span><span class="h">${fmtH(h)}</span></div>
    <div class="sd-b ${closed ? 'closed' : ''}" data-date="">${tasks.length ? tasks.map(t => renderRow(t)).join('') : '<div class="empty">いつかやるタスクはありません</div>'}</div>
  </div>`;
}

function renderSections(vis, today) {
  const groups = new Map();
  for (const t of vis) {
    if (!t.scheduled_date || t.scheduled_date < today) continue; // 過去分は Review、日付なしは右下の「いつかやる」で見る
    const k = t.scheduled_date;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  }
  const keys = [...groups.keys()].filter(k => k !== today).sort();
  const sec = (key, label, tasks, isToday) => {
    const h = tasks.reduce((a, t) => a + Number(t.estimated_hours || 0), 0);
    const closed = !isToday && S.collapsed[key];
    const head = isToday ? `<span>${label}</span><span class="n">${tasks.length} 件</span><span class="h">${fmtH(h)}</span>`
      : `<span>${label}</span><i class="ln"></i><span class="n" title="合計 ${fmtH(h)}">${tasks.length}件</span><svg viewBox="0 0 10 10"><path d="M1 2.5h8L5 8.5z" fill="currentColor"/></svg>`;
    return `<div class="sec-h ${isToday ? 'today' : ''} ${closed ? 'closed' : ''}" data-sec="${key}">${head}</div>
            <div class="sec-body ${closed ? 'closed' : ''}" data-date="${key}">${tasks.length ? tasks.sort(sortT).map(renderRow).join('') : `<div class="empty">${isToday ? '今日のタスクはまだありません。上の入力欄から追加してください。' : 'なし'}</div>`}</div>`;
  };
  let html = sec(today, '今日', groups.get(today) || [], true);
  if (keys.length) html += '<div class="fu-h">今後のタスク</div>';
  for (const k of keys) {
    const d = diffDays(today, k);
    html += sec(k, d === 1 ? `明日 ${fmtMD(k)}` : d === 2 ? `明後日 ${fmtMD(k)}` : fmtMD(k), groups.get(k));
  }
  return html;
}

function renderRow(t, { showDate = false } = {}) {
  const p = projectById(t.project_id);
  const today = todayStr();
  let due = '';
  if (t.due_date && t.status !== 'completed') {
    const d = diffDays(today, t.due_date);
    due = d < 0 ? `<span class="due over">${-d} 日超過</span>` : d === 0 ? `<span class="due over">今日まで</span>` : `<span class="due ${d <= 3 ? 'warn' : ''}">あと ${d} 日</span>`;
  }
  const owner = memberById(t.assignee_id || t.owner_id);
  const showAv = t.visibility === 'shared' && S.members.length > 1;
  const posted = t.repeat_rule_id ? '' : fmtPosted(t.created_at); // 繰り返しは自動で作られるので投稿時刻を出さない
  return `<div class="row ${t.status === 'completed' ? 'done' : ''}" data-id="${t.id}"${p ? ` style="--pc:${esc(p.color)}"` : ''}>
    <span class="grip">⋮⋮</span>
    <button class="chk" title="${t.status === 'completed' ? '未完了に戻す' : '完了'}">${ICON.check}</button>
    ${t.important ? '<span class="imp">!</span>' : ''}
    <div class="body"><span class="title" title="${esc(t.title)}">${posted ? `<span class="st" title="投稿 ${esc(fmtPostedFull(t.created_at))}">${esc(posted)}</span>` : ''}<span class="tx">${esc(t.title)}</span></span>${t.note ? `<div class="sub" title="${esc(t.note)}">${esc(t.note.replace(/\s*\n\s*/g, ' / '))}</div>` : ''}</div>
    <span class="tags">
      ${t.repeat_rule_id ? `<span class="rep" title="${esc(ruleLabel(ruleById(t.repeat_rule_id)) || '繰り返し')}">↻</span>` : ''}
      ${t.visibility === 'shared' ? `<button class="chip sh to-mine" title="押すと自分用タスクにする"><span class="a">共有</span><span class="b">自分用に</span></button>` : ''}
      ${showAv ? avatar(owner) : ''}
      ${p ? `<span class="chip pj" style="background:${hex20(p.color)};color:${esc(p.color)}">${esc(p.name)}</span>` : ''}
      ${due}
      ${t.carried_over ? `<span class="carry">持ち越し×${t.carried_over}</span>` : ''}
    </span>
    <span class="hrs" title="クリックで変更">${fmtH(taskHours(t))}</span>
    <button class="del" title="削除">${ICON.x}</button>
    ${t.divider_after ? '' : `<span class="dvz"><button class="dv" title="ここに分割線を入れる">${ICON.divider}</button></span>`}
  </div>${t.divider_after ? `<div class="dvl" data-div="${t.id}" title="クリックで分割線を消す"><i></i><b>${ICON.x}</b></div>` : ''}`;
}

/* ---------- ドラッグ移動（日付またぎ・いつかやるとの行き来も可。PC のマウス操作用） ---------- */
let dragTask = null;
const clearDropMarks = () => $$('.drop-before,.drop-after,.drop-end').forEach(el => el.classList.remove('drop-before', 'drop-after', 'drop-end'));
function bindDrag(row, t) {
  if (!row.closest('[data-date]')) return; // Review の一覧では動かさない
  row.draggable = true;
  row.ondragstart = e => { dragTask = t; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', t.id); };
  row.ondragend = () => { dragTask = null; row.classList.remove('dragging'); clearDropMarks(); };
  const isAfter = e => { const r = row.getBoundingClientRect(); return e.clientY > r.top + r.height / 2; };
  row.ondragover = e => { if (!dragTask || dragTask === t) return; e.preventDefault(); clearDropMarks(); row.classList.add(isAfter(e) ? 'drop-after' : 'drop-before'); };
  row.ondrop = e => { e.preventDefault(); e.stopPropagation(); if (dragTask && dragTask !== t) moveTask(dragTask, t.scheduled_date, t, isAfter(e)); };
}
function bindDropZones() {
  $$('[data-date]').forEach(box => {
    box.ondragover = e => { if (!dragTask || e.target.closest('.row')) return; e.preventDefault(); clearDropMarks(); box.classList.add('drop-end'); };
    box.ondragleave = e => { if (e.target === box) box.classList.remove('drop-end'); };
    box.ondrop = e => { e.preventDefault(); if (dragTask) moveTask(dragTask, box.dataset.date || null); };
  });
}
async function patchMany(pairs) {
  pairs.forEach(([t, patch]) => Object.assign(t, patch)); render();
  try { await Promise.all(pairs.map(([t, patch]) => S.store.update('tasks', t.id, patch))); } catch (e) { fail(e); reload(false); }
}
async function moveTask(t, date, target = null, after = false) {
  const sameDay = d => (d ? visibleTasks().filter(x => x.scheduled_date === d) : somedayTasks()).sort(sortT);
  const pairs = [], before = { scheduled_date: t.scheduled_date, sort: t.sort, visibility: t.visibility, owner_id: t.owner_id, assignee_id: t.assignee_id, divider_after: t.divider_after };
  // いつかやるへ入れたら自分用に。共有タブの一覧へ出したら共有に（置いた場所から消えないように）
  const scope = !date ? (t.visibility === 'shared' || t.owner_id !== S.me.id ? { visibility: 'private', owner_id: S.me.id, assignee_id: null } : {})
    : S.filter === 'shared' && t.visibility !== 'shared' ? { visibility: 'shared', assignee_id: S.me.id } : {};
  // 動かすタスクの下にあった分割線はその場に残す（一つ上のタスクへ引き継ぐ）
  let divider = false;
  if (t.divider_after) { const old = sameDay(t.scheduled_date), up = old[old.indexOf(t) - 1]; if (up && up !== target) pairs.push([up, { divider_after: true }]); }
  // タスクの下半分に落としたら分割線より上に入る
  if (target && after && target.divider_after) { divider = true; pairs.push([target, { divider_after: false }]); }
  const list = sameDay(date).filter(x => x !== t);
  const idx = target ? list.indexOf(target) + (after ? 1 : 0) : list.length;
  const prev = list[idx - 1], next = list[idx];
  const a = prev && Number(prev.sort), b = next && Number(next.sort);
  const sort = prev && next ? Math.round((a + b) / 2) : prev ? a + 1000 : next ? b - 1000 : Date.now();
  if (prev && next && (sort <= a || sort >= b)) { // 間が詰まったら振り直す
    const base = Date.now(); list.splice(idx, 0, t);
    list.forEach((x, i) => { if (x !== t) pairs.push([x, { sort: base + i * 1000 }]); });
    pairs.push([t, { sort: base + idx * 1000, scheduled_date: date, divider_after: divider, ...scope }]);
  } else pairs.push([t, { sort, scheduled_date: date, divider_after: divider, ...scope }]);
  await patchMany(pairs);
  if (scope.visibility) toast(scope.visibility === 'private' ? 'いつかやるに移して、自分用にしました' : '共有に入れました', { action: '元に戻す', onAction: () => patchTask(t, before) });
}

function bindList() {
  bindDropZones();
  $$('.dvl').forEach(l => l.onclick = () => { const t = S.tasks.find(x => x.id === l.dataset.div); if (t) patchTask(t, { divider_after: false }); });
  $$('.sec-h[data-sec]').forEach(h => h.onclick = () => {
    if (h.classList.contains('today')) return;
    const k = h.dataset.sec; S.collapsed[k] = !S.collapsed[k]; LS.set('collapsed', S.collapsed);
    toggleBody(h, h.nextElementSibling, !!S.collapsed[k]);
  });
  $$('.row').forEach(row => {
    const id = row.dataset.id; const t = S.tasks.find(x => x.id === id); if (!t) return;
    $('.chk', row).onclick = () => toggleDone(t);
    $('.del', row).onclick = () => removeTask(t);
    const dv = $('.dv', row);
    if (dv) { dv.onclick = (e) => { e.stopPropagation(); patchTask(t, { divider_after: true }); }; dv.onmousedown = e => e.stopPropagation(); }
    bindDrag(row, t);
    const toMine = $('.to-mine', row);
    if (toMine) toMine.onclick = (e) => { e.stopPropagation(); makeMine(t); };
    $('.title', row).onclick = () => openTaskModal(t);
    const sub = $('.sub', row);
    if (sub) sub.onclick = () => openTaskModal(t);
    $('.hrs', row).onclick = (e) => {
      e.stopPropagation();
      const cur = taskHours(t);
      const sel = document.createElement('select'); sel.className = 'hrs-sel';
      const opts = [...new Set([...HOURS, cur])].sort((a, b) => a - b);
      sel.innerHTML = opts.map(h => `<option value="${h}" ${h === cur ? 'selected' : ''}>${fmtH(h)}</option>`).join('');
      e.target.replaceWith(sel); sel.focus();
      const commit = () => { const v = parseFloat(sel.value); patchTask(t, t.status === 'completed' ? { actual_hours: v } : { estimated_hours: v }); };
      sel.onchange = commit; sel.onblur = () => render();
    };
  });
}

async function patchTask(t, patch) {
  Object.assign(t, patch); render();
  try { await S.store.update('tasks', t.id, patch); } catch (e) { fail(e); reload(false); }
}
async function toggleDone(t) {
  if (t.status === 'completed') return patchTask(t, { status: 'pending', completed_at: null, actual_hours: null });
  const patch = { status: 'completed', completed_at: new Date().toISOString(), actual_hours: t.actual_hours ?? t.estimated_hours };
  S.justDone = t.id;

function historyHint(t) {

// タイトルと本文を 1 枚の紙のように行き来する
function bindNoteDoc(title, body, { submit, cancel }) {
  const grow = () => { body.style.height = 'auto'; body.style.height = Math.min(220, body.scrollHeight) + 'px'; };
  body.addEventListener('input', grow); grow();
  return pick => {
    title.oninput = () => pick.input();
    title.onkeydown = e => {
      if (pick.key(e) || imeKey(e)) return;
      if (e.key === 'Enter') { e.preventDefault(); if (e.shiftKey) { body.focus(); body.setSelectionRange(0, 0); } else submit(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); body.focus(); body.setSelectionRange(0, 0); }
      else if (e.key === 'Escape') cancel();
    };
    body.onkeydown = e => {
      if (imeKey(e)) return;
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
      else if (e.key === 'Escape') cancel();
      else if ((e.key === 'ArrowUp' && body.selectionStart === 0) || (e.key === 'Backspace' && !body.value)) { e.preventDefault(); title.focus(); const n = title.value.length; title.setSelectionRange(n, n); }
    };
  };
}
async function removeNote(n) {
  const idx = S.notes.indexOf(n); S.notes.splice(idx, 1); if (S.openNote === n.id) S.openNote = null; render();
  let undone = false;
  toast('メモを削除しました', { action: '元に戻す', onAction: () => { undone = true; S.notes.splice(idx, 0, n); render(); } });
  setTimeout(async () => { if (undone) return; try { await S.store.remove('notes', n.id); } catch (e) { fail(e); reload(false); } }, 3600);
}
function bindNotes() {
  const addBox = $('.add', $('#notes')), title = $('#n-title'), body = $('#n-body');
  const pick = makePicker({ name: 'note', input: title, host: $('#n-doc'), parse: parseNoteTitle, kinds: ['project', 'vis'] });
  const filled = () => addBox.classList.toggle('filled', !!(title.value || body.value));
  pick.onChange(q => { if (q.projectId) $('#n-proj').value = q.projectId; if (q.vis) $('#n-vis').value = q.vis; filled(); });
  title.addEventListener('sync', () => { pick.refresh(); });
  body.addEventListener('input', filled);
  const submit = async () => {
    const q = pick.value(), content = noteJoin(q.title, body.value); if (!content.trim()) { title.focus(); return; }
    const row = { id: uid(), owner_id: S.me.id, visibility: q.vis || $('#n-vis').value, project_id: q.projectId || $('#n-proj').value || null, content, created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
    pick.reset(); S.notes.unshift(row); S.noteClear = true; render(); $('#n-title').focus();
    if ((row.visibility === 'shared') !== (S.filter === 'shared')) noteMoved(row.visibility);
    try { Object.assign(row, await S.store.insert('notes', row)); } catch (e) { S.notes = S.notes.filter(n => n.id !== row.id); render(); fail(e); }
  };
  bindNoteDoc(title, body, { submit, cancel: () => document.activeElement.blur() })(pick);
  $('#n-add').onclick = submit;
  $('.help-btn', $('#n-help')).onclick = e => { e.stopPropagation(); $('#n-help').classList.toggle('open'); };
  $$('.note').forEach(card => {
    const id = card.dataset.id, n = S.notes.find(x => x.id === id), open = card.classList.contains('open');
    card.onclick = () => {
      if (card.classList.contains('open')) return;
      S.openNote = id; S.cursor = null; render();
      const c = $(`.note[data-id="${id}"]`); c?.classList.add('opening');
      if (c) { const b = $('.nt-b', c); b.focus(); const e = b.value.length; b.setSelectionRange(e, e); }
    };
    $('.nd', card).onclick = e => { e.stopPropagation(); removeNote(n); };
    if (!open) return;
    const t = $('.nt-t', card), b = $('.nt-b', card);
    const ep = makePicker({ name: 'edit', input: t, host: $('.nt-doc', card), parse: parseNoteTitle, kinds: ['project', 'vis'] });
    ep.onChange(q => { if (q.projectId) $('.np', card).value = q.projectId; if (q.vis) $('.nv', card).value = q.vis; });
    const commit = async () => {
      const q = ep.value(), content = noteJoin(q.title, b.value);

      if (!content.trim()) { removeNote(n); return; }
      const patch = { content, project_id: q.projectId || $('.np', card).value || null, visibility: q.vis || $('.nv', card).value };
      const changed = patch.content !== n.content || patch.project_id !== (n.project_id || null) || patch.visibility !== n.visibility;
      if (changed) patch.updated_at = new Date().toISOString();
      if (changed) Object.assign(n, patch);
      S.openNote = null; render();
      if ((patch.visibility === 'shared') !== (S.filter === 'shared')) noteMoved(patch.visibility);
      if (changed) try { await S.store.update('notes', n.id, patch); } catch (err) { fail(err); reload(false); }
    };
    bindNoteDoc(t, b, { submit: commit, cancel: commit })(ep);
    $('.ns', card).onclick = e => { e.stopPropagation(); commit(); };
  });

/* ---------- 積み上げ（カレンダーヒートマップ）----------
   下のカレンダーと同じ月を、同じ曜日の並びで 1 日 1 マス出す。色は「その日の基準時間に対してどれだけやったか」。
   自分が担当した完了タスクだけを数える。 */
function effortByDay() {
  const map = new Map();
  for (const t of S.tasks) {
    if (t.status !== 'completed' || !visibleToMe(t) || (t.assignee_id || t.owner_id) !== S.me.id) continue;
    const k = t.scheduled_date || dateOfTs(t.completed_at); if (!k) continue;
    const e = map.get(k) || { h: 0, n: 0 }; e.h += taskHours(t); e.n++; map.set(k, e);
  }
  return map;
}
const heatLevel = (e, ds) => { if (!e) return 0; const r = e.h / (fullBaseline(ds) || 4); return r >= 1 ? 4 : r >= .67 ? 3 : r >= .34 ? 2 : 1; };
function renderHeat() {
  const today = todayStr(), data = effortByDay(), [y, mo] = S.calMonth.split('-').map(Number);
  const offset = new Date(y, mo - 1, 1).getDay(), days = new Date(y, mo, 0).getDate();
  let cells = '', total = 0, count = 0, best = null, run = 0, longest = 0;
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad(mo)}-${pad(d)}`, i = offset + d - 1, c = i % 7, r = Math.floor(i / 7), e = data.get(ds), future = ds > today;
    if (e) { total += e.h; count += e.n; run++; longest = Math.max(longest, run); if (!best || e.h > best.h) best = { h: e.h, d }; } else run = 0;
    const tip = `${fmtMD(ds)}  ${e ? `${fmtH(e.h)} ・ ${e.n} 件` : future ? 'これから' : '記録なし'}`;
    cells += `<div class="hc l${heatLevel(e, ds)} ${future ? 'fu' : ''} ${ds === today ? 'today' : ''} ${ds === S.calSelected ? 'sel' : ''}" data-d="${ds}" data-t="${tip}" style="grid-column:${c + 1};grid-row:${r + 2};--c:${c};--r:${r}">${d}</div>`;
  }
  let streak = 0, cur = data.get(today) ? today : addDays(today, -1);
  while (data.get(cur)) { streak++; cur = addDays(cur, -1); }
  const tot = Math.round(total * 100) / 100;
  return `<div class="card" id="heat-card">
    <div class="heat-head">
      <div class="heat-lg"><span>少</span>${[0, 1, 2, 3, 4].map(l => `<i class="l${l}"></i>`).join('')}<span>基準達成</span></div>
    </div>
    <div class="heat-body">
      <div class="heat-stats">
        <div><b data-tw="${tot}" data-f="h">${fmtH(tot)}</b><span>${mo}月の実績</span></div>
        <div><b data-tw="${count}" data-f="n" data-s=" 件">${count} 件</b><span>完了したタスク</span></div>
        <div><b data-tw="${streak}" data-f="n" data-s=" 日">${streak} 日</b><span>いまの連続（この月の最長 ${longest} 日）</span></div>
        <div><b data-tw="${best ? best.h : 0}" data-f="h">${fmtH(best ? best.h : 0)}</b><span>${best ? `いちばんやった日 ${mo}/${best.d}` : 'いちばんやった日'}</span></div>
      </div>
      <div class="heat-wrap"><div class="heat ${S.heatPlay && MOTION ? 'play' : ''}" id="heat">${WD.map((w, i) => `<span class="hw" style="grid-column:${i + 1}">${w}</span>`).join('')}${cells}</div></div>
    </div>
  </div>`;
}
function bindHeat() {
  const heat = $('#heat'), tip = $('#heat-tip');
  const unlink = () => $$('.cal .c.link').forEach(x => x.classList.remove('link'));
  tip.classList.remove('on');
  heat.onmouseover = e => {
    const c = e.target.closest('.hc'); if (!c) return;
    const r = c.getBoundingClientRect(), x = Math.max(80, Math.min(innerWidth - 80, r.left + r.width / 2)), y = r.top - 8;
    if (!tip.classList.contains('on')) { tip.style.transition = 'none'; tip.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%)`; void tip.offsetWidth; tip.style.transition = ''; }
    tip.textContent = c.dataset.t; tip.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%)`; tip.classList.add('on');
    unlink(); $(`.cal .c[data-d="${c.dataset.d}"]`)?.classList.add('link'); // 下のカレンダーの同じ日も光らせる
  };
  heat.onmouseleave = () => { tip.classList.remove('on'); unlink(); };
  heat.onclick = e => {
    const c = e.target.closest('.hc'); if (!c) return;
    S.calSelected = S.calSelected === c.dataset.d ? null : c.dataset.d; tip.classList.remove('on'); render();
    if (S.calSelected) setTimeout(() => $('#day-detail')?.scrollIntoView({ behavior: MOTION ? 'smooth' : 'auto', block: 'nearest' }), 80);
  };
  if (S.heatPlay) $$('[data-tw]', $('#heat-card')).forEach(b => { const v = Number(b.dataset.tw), s = b.dataset.s || ''; tween(0, v, 900, x => { b.textContent = b.dataset.f === 'h' ? fmtH(Math.round(x * 100) / 100) : Math.round(x) + s; }); });
}

/* ---------- Review ---------- */
function renderReview(m) {
  const today = todayStr();
  const [y, mo] = S.calMonth.split('-').map(Number);
  const first = new Date(y, mo - 1, 1);
  const start = new Date(y, mo - 1, 1 - first.getDay());
  const vis = S.tasks.filter(visibleToMe);
  const byDay = new Map();
  for (const t of vis) { const k = t.scheduled_date || (t.status === 'completed' ? dateOfTs(t.completed_at) : null); if (!k) continue; if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(t); }
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const ds = toYMD(d);
    const list = byDay.get(ds) || []; const done = list.filter(t => t.status === 'completed');
    const h = done.reduce((a, t) => a + taskHours(t), 0); const rv = myReviewFor(ds);
    cells.push(`<div class="c ${d.getMonth() !== mo - 1 ? 'out' : ''} ${ds === today ? 'today' : ''} ${ds === S.calSelected ? 'sel' : ''}" data-d="${ds}">
      <span class="n">${d.getDate()}</span>${rv?.score != null ? `<span class="sc">${rv.score}</span>` : ''}
      ${h > 0 ? `<span class="h">${fmtH(h)}</span>` : (list.length ? `<span class="h" style="color:var(--gray-400)">${list.length} 件</span>` : '')}
      ${done.length ? `<span class="dots">${'<i></i>'.repeat(Math.min(done.length, 5))}</span>` : ''}
    </div>`);
  }
  const monthTasks = vis.filter(t => t.scheduled_date && ymOf(t.scheduled_date) === S.calMonth);
  const monthDone = monthTasks.filter(t => t.status === 'completed');
  const monthH = monthDone.reduce((a, t) => a + taskHours(t), 0);
  const pjCards = S.projects.filter(p => !p.archived).map(p => {
    const pt = monthTasks.filter(t => t.project_id === p.id); const pd = pt.filter(t => t.status === 'completed');
    const ph = pd.reduce((a, t) => a + taskHours(t), 0); const rate = pt.length ? Math.round(pd.length / pt.length * 100) : 0;
    return `<div class="pj click" data-pj="${p.id}" title="リザルトを見る"><div class="t"><i style="background:${esc(p.color)}"></i>${esc(p.name)}<span>${fmtH(ph)}</span></div><div class="m">完了 ${pd.length}/${pt.length} 件 ・ ${rate}%</div><div class="bar"><i style="width:${rate}%"></i></div></div>`;
  }).join('');

  m.innerHTML = `
    ${renderHeat()}
    <div class="card">
      <div class="cal-head">
        <button class="nb" id="cal-prev">${ICON.left}</button>
        <h2>${y}年 ${mo}月</h2>
        <button class="nb" id="cal-next">${ICON.right}</button>
        <span class="sp"></span>
        <span class="muted">実績 ${fmtH(monthH)} ・ 完了 ${monthDone.length} 件</span>
        <button class="btn ghost sm" id="cal-today">今日</button>
        <button class="btn out sm" id="cal-result">リザルト</button>
      </div>
      <div class="cal-wd">${WD.map(w => `<span>${w}</span>`).join('')}</div>
      <div class="cal" id="cal">${cells.join('')}</div>
    </div>
    ${S.calSelected ? renderDayDetail(S.calSelected, byDay.get(S.calSelected) || []) : ''}
    <div class="card">
      <h3>プロジェクト <span class="cnt">${y}年 ${mo}月</span></h3>
      ${pjCards ? `<div class="pj-grid">${pjCards}</div>` : '<div class="empty">プロジェクトがありません</div>'}
      <p class="muted" style="margin:10px 0 0">カードを押すとそのプロジェクトのリザルト（時給）が見られます。売上は Settings → 売上 で入力。</p>
    </div>`;

  bindHeat();
  if (S.calSlide && MOTION) $('#cal').animate([{ opacity: 0, transform: `translateX(${S.calSlide * 18}px)` }, { opacity: 1, transform: 'none' }], { duration: 380, easing: EASE });
  S.calSlide = 0;
  const shift = n => { const d = new Date(y, mo - 1 + n, 1); S.calMonth = toYMD(d).slice(0, 7); S.calSlide = n; render(); };
  $('#cal-prev').onclick = () => shift(-1); $('#cal-next').onclick = () => shift(1);
  $('#cal-result').onclick = () => openResultModal(S.calMonth, null);
  $$('.pj[data-pj]').forEach(c => c.onclick = () => openResultModal(S.calMonth, c.dataset.pj));
  $('#cal-today').onclick = () => { S.calMonth = today.slice(0, 7); S.calSelected = today; render(); };
  $$('#cal .c').forEach(c => c.onclick = () => { S.calSelected = S.calSelected === c.dataset.d ? null : c.dataset.d; render(); });
  if (S.calSelected) bindDayDetail(S.calSelected);
}

/* ---------- リザルト（時給） ---------- */
async function openResultModal(ym, projectId) {
  openModal(`${fmtYm(ym)} のリザルト`, `<div class="placeholder">集計中…</div>`, [{ label: '閉じる', cls: 'out', onClick: closeModal }]);
  let rows;
  try { rows = await S.store.projectHours(ym); } catch (e) { fail(e); closeModal(); return; }
  const hoursOf = pid => rows.find(r => (r.project_id || null) === pid) || { hours: 0, cnt: 0, my_hours: 0 };
  const projs = S.projects.filter(p => !p.archived || revenueOf(p.id, ym) || hoursOf(p.id).hours);
  const totalRev = projs.reduce((a, p) => a + revenueOf(p.id, ym), 0);
  const totalH = rows.reduce((a, r) => a + Number(r.hours), 0);
  const myH = rows.reduce((a, r) => a + Number(r.my_hours), 0);
  const rate = (rev, h) => h > 0 && rev > 0 ? fmtYen(rev / h) : '—';
  const other = hoursOf(null);
  let body = `
    <div class="rv-h">全体の時給</div>
    <div class="score"><b>${rate(totalRev, totalH)}</b><span>/ 時間</span></div>
    <div class="muted">売上 ${fmtYen(totalRev)} ÷ ${fmtH(totalH)}（うち自分 ${fmtH(myH)}）</div>
    <div class="rv-h" style="margin-top:8px">プロジェクト別</div>
    <table class="res"><tr><th>プロジェクト</th><th class="r">売上</th><th class="r">時間</th><th class="r">時給</th></tr>
      ${projs.map(p => { const h = hoursOf(p.id); const rev = revenueOf(p.id, ym); return `<tr><td><span class="chip" style="background:${hex20(p.color)};color:${esc(p.color)}">${esc(p.name)}</span></td><td class="r">${rev ? fmtYen(rev) : '<span class="muted">未入力</span>'}</td><td class="r">${fmtH(h.hours)}</td><td class="r"><b>${rate(rev, Number(h.hours))}</b></td></tr>`; }).join('')}
      ${other.hours ? `<tr><td class="muted">プロジェクトなし</td><td class="r">—</td><td class="r">${fmtH(other.hours)}</td><td class="r">—</td></tr>` : ''}
    </table>`;
  if (projectId) {
    const p = projectById(projectId);
    const months = [0, -1, -2, -3, -4, -5].map(n => addMonths(ym, n));
    let hist = [];
    try { hist = await Promise.all(months.map(m => S.store.projectHours(m))); } catch (e) { console.error(e); }
    body += `<div class="rv-h" style="margin-top:8px">${esc(p?.name || '')} の推移（直近 6 か月）</div>
      <table class="res"><tr><th>月</th><th class="r">売上</th><th class="r">時間</th><th class="r">時給</th></tr>
      ${months.map((m, i) => { const h = Number((hist[i] || []).find(r => r.project_id === projectId)?.hours || 0); const rev = revenueOf(projectId, m); return `<tr><td>${fmtYm(m)}</td><td class="r">${rev ? fmtYen(rev) : '<span class="muted">—</span>'}</td><td class="r">${fmtH(h)}</td><td class="r"><b>${rate(rev, h)}</b></td></tr>`; }).join('')}
      </table>`;
  }
  body += `<div class="muted">時間はメンバー全員の完了タスクの実績時間（個人タスクは合計だけ）。売上は月単位の手入力です。</div>`;
  openModal(`${fmtYm(ym)} のリザルト`, body, [
    { label: '売上を入力', cls: 'ghost', onClick: () => { closeModal(); S.revMonth = ym; S.tab = 'settings'; LS.set('tab', 'settings'); render(); setTimeout(() => $('#rev-card')?.scrollIntoView({ behavior: 'smooth' }), 50); } },
    { spacer: true },
    { label: '閉じる', cls: 'pri', onClick: closeModal }
  ]);
}

function renderDayDetail(date, list) {
  const done = list.filter(t => t.status === 'completed');
  const plan = list.reduce((a, t) => a + Number(t.estimated_hours || 0), 0);
  const act = done.reduce((a, t) => a + taskHours(t), 0);
  const rv = myReviewFor(date);
  const sortT = (a, b) => (a.status === b.status ? 0 : a.status === 'completed' ? 1 : -1) || (a.sort - b.sort);
  return `<div class="card list" id="day-detail">
    <div style="padding:14px 14px 8px">
      <div class="d1" style="display:flex;align-items:center;gap:8px"><h2 style="margin:0;font-size:15px;font-weight:700">${fmtMD(date)}</h2><span style="flex:1"></span>${date < todayStr() ? `<button class="btn ghost sm" id="day-review">この日を振り返る</button>` : ''}</div>
      <div class="day-sum" style="margin-top:6px"><span>予定 <b>${fmtH(plan)}</b></span><span>実績 <b>${fmtH(act)}</b></span><span>完了 <b>${done.length}/${list.length}</b> 件</span>${rv?.score != null ? `<span>スコア <b>${rv.score}</b></span>` : ''}</div>
    </div>
    ${list.length ? list.sort(sortT).map(t => renderRow(t)).join('') : '<div class="empty">この日のタスクはありません</div>'}
    <div style="padding:12px 14px;border-top:1px solid var(--gray-100)">
      <div class="field"><label>振り返りメモ</label><textarea id="day-memo" rows="2" placeholder="この日のひとこと">${esc(rv?.memo || '')}</textarea></div>
      <div class="row-actions" style="margin-top:8px"><button class="btn out sm" id="day-memo-save">メモを保存</button></div>
    </div>
  </div>`;
}
function bindDayDetail(date) {
  bindList();
  $('#day-review') && ($('#day-review').onclick = () => openReviewModal(date));
  $('#day-memo-save').onclick = async () => {
    const list = tasksOfDay(date); const done = list.filter(t => t.status === 'completed'); const rv = myReviewFor(date);
    const row = { member_id: S.me.id, date, completed_count: done.length, total_count: list.length, planned_hours: list.reduce((a, t) => a + Number(t.estimated_hours || 0), 0), actual_hours: done.reduce((a, t) => a + taskHours(t), 0), score: rv?.score ?? null, memo: $('#day-memo').value, created_at: rv?.created_at || new Date().toISOString() };
    try { const saved = await S.store.upsertReview(row); S.reviews = S.reviews.filter(r => !(r.member_id === S.me.id && r.date === date)); S.reviews.push(saved || row); toast('保存しました', { ms: 1500 }); render(); } catch (e) { fail(e); }
  };
}

// テーマの切り替えは、押した場所から円が広がるように変える
function setTheme(ev, patch) {
  const run = () => {
    localStorage.setItem('taskdock_theme', JSON.stringify(Object.assign(loadTheme(), patch)));
    applyTheme();
    const t = loadTheme();
    $$('#mode-seg button').forEach(b => b.classList.toggle('on', b.dataset.m === t.mode));
    $$('#swatches .swc').forEach(b => b.classList.toggle('on', b.dataset.t === t.id));
    placePill($('#mode-seg'), 'mode');
  };
  if (!MOTION || !document.startViewTransition) { run(); return; }
  const x = ev.clientX, y = ev.clientY, r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  document.startViewTransition(run).ready.then(() => document.documentElement.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] }, { duration: 560, easing: EASE, pseudoElement: '::view-transition-new(root)' })).catch(() => {});
}
function bindTheme() {
  $$('#mode-seg button').forEach(b => b.onclick = e => setTheme(e, { mode: b.dataset.m }));
  $$('#swatches .swc').forEach(b => b.onclick = e => setTheme(e, { id: b.dataset.t }));
}

  <div class="card">
    <h3>繰り返しタスク <span class="cnt">${myRules.length}</span></h3>
    ${myRules.length ? `<div class="set-list">${myRules.map(r => `<div class="set-item"><span class="rep" style="color:var(--gray-400)">↻</span><span class="nm">${esc(r.template?.title || '')} <span class="sub">${esc(ruleLabel(r))}${r.end_date ? ` ・ ${r.end_date} まで` : ''} ・ ${fmtH(r.template?.estimated_hours || 1)}${r.template?.visibility === 'shared' ? ' ・ 共有' : ''}</span></span><button class="x" data-rd="${r.id}" title="解除">${ICON.x}</button></div>`).join('')}</div>` : '<p class="muted" style="margin:0">まだありません。タスクの編集画面か、追加欄の「繰り返し」から作れます。</p>'}
  </div>

  <div class="card">
    <h3>データ</h3>
    <div class="stat"><div><b>${vt.length}</b>タスク</div><div><b>${vt.filter(t => t.status === 'completed').length}</b>完了</div><div><b>${S.projects.length}</b>プロジェクト</div><div><b>${S.notes.filter(n => n.visibility === 'shared' || n.owner_id === S.me.id).length}</b>メモ</div><div><b>${S.reviews.filter(r => r.member_id === S.me.id).length}</b>振り返り</div></div>
    <div class="row-actions"><button class="btn out" id="d-export">JSON でエクスポート</button>${(!sup || isOwner()) ? `<button class="btn danger" id="d-clear">タスクとメモを全削除</button>` : ''}</div>
  </div>`;

  $('#c-save').onclick = () => { LS.set('supabase', { url: $('#c-url').value.trim(), key: $('#c-key').value.trim() }); location.reload(); };
  $('#c-logout') && ($('#c-logout').onclick = async () => { await S.store.signOut(); location.reload(); });
  $('#c-clear') && ($('#c-clear').onclick = () => { if (confirm('接続を解除してローカルモードに戻しますか？（Supabase 側のデータは消えません）')) { LS.set('supabase', { url: '', key: '' }); location.reload(); } });

  const saveMe = debounce(async () => {
    const patch = { name: $('#s-name').value.trim(), weekday_hours: parseFloat($('#s-wd').value), weekend_hours: parseFloat($('#s-we').value) };
    Object.assign(S.me, patch); const mm = memberById(S.me.id); mm && Object.assign(mm, patch); renderNav();
    try { await S.store.update('members', S.me.id, patch); toast('保存しました', { ms: 1500 }); } catch (e) { fail(e); }
  }, 400);
  ['#s-name', '#s-wd', '#s-we'].forEach(s => $(s).oninput = saveMe);
  $('#s-sh').onchange = async () => { const v = parseFloat($('#s-sh').value); S.settings.shared_daily_hours = v; try { await S.store.setSetting('shared_daily_hours', v); toast('保存しました', { ms: 1500 }); } catch (e) { fail(e); } };

  $('#mb-add') && ($('#mb-add').onclick = async () => {
    const em = $('#mb-email').value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('メールアドレスを確認してください', { err: true }); return; }
    try { const row = await S.store.insert('members', { email: em, name: '', role: 'member', weekday_hours: 2.5, weekend_hours: 6 }); S.members.push(row); render(); toast('追加しました。相手が Google ログインすると有効になります'); } catch (e) { fail(e); }
  });
  $$('[data-del-member]').forEach(b => b.onclick = async () => {
    const x = memberById(b.dataset.delMember); if (!confirm(`${x.name || x.email} をメンバーから外しますか？`)) return;
    try { await S.store.remove('members', x.id); S.members = S.members.filter(y => y.id !== x.id); render(); } catch (e) { fail(e); }
  });

  $('#pj-add').onclick = async () => {
    const name = $('#pj-name').value.trim(); if (!name) return;
    const row = { id: uid(), name, color: $('#pj-color').value, sort: S.projects.length, archived: false, created_at: new Date().toISOString() };
    try { S.projects.push(await S.store.insert('projects', row)); render(); } catch (e) { fail(e); }
  };
  $('#pj-name').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) $('#pj-add').click(); };
  $$('[data-pc]').forEach(i => i.onchange = async () => { const p = projectById(i.dataset.pc); p.color = i.value; try { await S.store.update('projects', p.id, { color: p.color }); } catch (e) { fail(e); } });
  $$('[data-pa]').forEach(b => b.onclick = async () => { const p = projectById(b.dataset.pa); p.archived = !p.archived; render(); try { await S.store.update('projects', p.id, { archived: p.archived }); } catch (e) { fail(e); } });
  $$('[data-pd]').forEach(b => b.onclick = async () => {
    // その場では消さず、数秒は「元に戻す」が効くようにする
    const p = projectById(b.dataset.pd), idx = S.projects.indexOf(p);
    const tasks = S.tasks.filter(t => t.project_id === p.id), notes = S.notes.filter(n => n.project_id === p.id), hasRev = S.revenues.some(r => r.project_id === p.id);
    S.projects.splice(idx, 1); [...tasks, ...notes].forEach(x => { x.project_id = null; }); render();
    let undone = false;
    toast(`「${p.name}」を削除しました${tasks.length ? `（タスク ${tasks.length} 件はプロジェクトなしに）` : ''}${hasRev ? ' 売上の記録も消えます' : ''}`, { action: '元に戻す', ms: 5000, onAction: () => {
      undone = true; S.projects.splice(idx, 0, p); [...tasks, ...notes].forEach(x => { x.project_id = p.id; }); render();
    } });
    setTimeout(async () => {
      if (undone) return;
      try {
        await S.store.remove('projects', p.id);
        if (S.store.mode === 'local') for (const [tb, list] of [['tasks', tasks], ['notes', notes]]) for (const x of list) await S.store.update(tb, x.id, { project_id: null });
      } catch (e) { fail(e); reload(false); }
    }, 5200);
  });

  $('#rev-month').onchange = () => { S.revMonth = $('#rev-month').value; render(); setTimeout(() => $('#rev-card')?.scrollIntoView(), 0); };
  $$('[data-rev]').forEach(i => i.onchange = async () => {
    const pid = i.dataset.rev; const amount = Math.max(0, Number(i.value) || 0);
    const row = { project_id: pid, year_month: S.revMonth, amount };
    try { const saved = await S.store.upsertRevenue(row); S.revenues = S.revenues.filter(r => !(r.project_id === pid && r.year_month === S.revMonth)); S.revenues.push(saved || row); toast('保存しました', { ms: 1500 }); } catch (e) { fail(e); }
  });

  $$('[data-rd]').forEach(b => b.onclick = async () => {
    const r = ruleById(b.dataset.rd); if (!confirm(`「${r.template?.title || ''}」の繰り返しを解除し、明日以降の未完了分を削除しますか？`)) return;
    try { await deleteRule(r); render(); toast('繰り返しを解除しました'); } catch (e) { fail(e); }
  });

  $('#d-export').onclick = () => {
    const data = { exported_at: new Date().toISOString(), me: S.me, members: S.members, projects: S.projects, work_types: S.workTypes, settings: S.settings, tasks: vt, notes: S.notes, reviews: S.reviews, repeat_rules: myRules };
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); a.download = `taskdock-${todayStr()}.json`; a.click();
  };
  $('#d-clear') && ($('#d-clear').onclick = async () => {
    if (!confirm('タスク・メモ・繰り返し・振り返りをすべて削除します。元に戻せません。よろしいですか？')) return;
    if (!confirm('本当に削除しますか？')) return;
    try { await S.store.clearAll(); if (S.store.mode === 'local') { location.reload(); return; } S.tasks = []; S.notes = []; S.reviews = []; S.repeatRules = []; render(); toast('削除しました'); } catch (e) { fail(e); }
  });
}

/* ---------- 開発用 ---------- */
window.taskdock = { state: S, reload: () => reload(false), openReview: d => openReviewModal(d || addDays(todayStr(), -1)), generateRepeats };
window.demoOpenReview = () => openReviewModal(addDays(todayStr(), -1));

boot();
</script>
</body>
</html>
